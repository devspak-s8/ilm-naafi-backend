name = "ilm-naafi-backend"
main = "src/index.ts"
compatibility_date = "2024-12-05"

# Run `npx wrangler d1 create ilm-naafi-db` and paste the id here.
[[d1_databases]]
binding = "DB"
database_name = "ilm-naafi-db"
database_id = "9b0f8306-8d3f-4b70-904e-6a389fde77ba"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "5ba77b14815740bfa9abd4d626c0ee33"

# Cloudflare Email Workers (native email sending; requires Workers Paid plan).
[[send_email]]
name = "SEND_EMAIL"

# Adhkar reminders run every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]

[vars]
JWT_ISSUER = "ilm-nafi"
ACCESS_TOKEN_EXPIRATION = "900"
REFRESH_TOKEN_EXPIRATION = "604800"
APP_URL = "https://api.ilmnafi.com"
EMAIL_FROM = "noreply@ilmnafi.com"
EMAIL_FROM_NAME = "Ilm Nafi"
RATE_LIMIT_REQUESTS = "10"
RATE_LIMIT_WINDOW = "60"
CORS_ALLOWED_ORIGINS = "https://ilm-naafi.com,https://www.ilm-naafi.com"
PBKDF2_ITERATIONS = "100000"
QURAN_PROVIDER = "quran_foundation"
QURAN_FOUNDATION_ENV = "production"
QURAN_PROVIDER_TIMEOUT = "15"
PASSKEY_RP_ID = "ilm-naafi.com"
PASSKEY_RP_NAME = "Ilm Nafi"
PASSKEY_ORIGIN = "https://ilm-naafi.com"
VAPID_PUBLIC_KEY = "BBaEN4-UeL7_KDg380VD9ZbEk9xOpC2k3Bo-LwdzXiDH7av8mLl6OenasaILoVS81VQwi31U_-AyI_iJtmnLtCw"