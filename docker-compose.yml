version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilm-naafi-postgres
    environment:
      POSTGRES_DB: ilmnafi
      POSTGRES_USER: ilmnafi
      POSTGRES_PASSWORD: ilmnafi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmnafi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build: .
    container_name: ilm-nafi-server
    # Port 8080 is exposed for local development. When running in production
    # behind Cloudflare Tunnel you can remove this mapping and rely on the
    # cloudflared service below.
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ilmnafi:ilmnafi@postgres:5432/ilmnafi?sslmode=disable
      JWT_ACCESS_SECRET: your-access-secret-key-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-key-change-in-production
      JWT_ISSUER: ilm-nafi
      EMAIL_PROVIDER: smtp
      EMAIL_SMTP_HOST: smtp.gmail.com
      EMAIL_SMTP_PORT: 587
      EMAIL_SMTP_USER: your-email@gmail.com
      EMAIL_SMTP_PASS: your-app-password
      EMAIL_FROM: noreply@ilmnafi.com
      EMAIL_FROM_NAME: Ilm Nafi
      APP_URL: http://localhost:8080
      SERVER_PORT: 8080
      # Set to true in production: requests arrive via Cloudflare Tunnel, so
      # the real client IP must be read from CF-Connecting-IP.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      # Comma-separated frontend origins allowed to call the API.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Cloudflare Tunnel: exposes the API to the internet without opening any
  # inbound ports. Start with:
  #   CLOUDFLARE_TUNNEL_TOKEN=<token> docker compose --profile cloudflare up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ilm-naafi-tunnel
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set to run the Cloudflare tunnel}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: